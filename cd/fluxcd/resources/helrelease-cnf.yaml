apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-message
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: cd/helm/parent-chart
      version: '1.0.0'
      sourceRef:
        kind: GitRepository
        name: app-message
        namespace: flux-system
      interval: 10m
  values:
    replicaCount: 1